name: keepalive-umami
on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Umami to prevent sleep
        run: |
          curl -s https://umami-postgresql-latest-8xgn.onrender.com/api/heartbeat > /dev/null || curl -s https://umami-postgresql-latest-8xgn.onrender.com/ > /dev/null
          echo "Pinged Umami at $(date -u)"
